
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultancy.london | Sovereign Intelligence Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@100..900&family=Inter:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              header: ['Bricolage Grotesque', 'sans-serif'],
              jakarta: ['Bricolage Grotesque', 'sans-serif'], // Redirecting legacy calls to new font
              mono: ['Geist Mono', 'monospace'],
            },
            colors: {
              'gpt-dark-bg': '#050505',
              'gpt-dark-sidebar': '#0D0D0D',
              'gpt-dark-input': '#171717',
              'london-blue': '#0052FF',
              'gold-accent': '#D4AF37',
              'obsidian': '#020203',
              'zinc-deep': '#09090b',
            },
            borderRadius: {
              'gpt': '1rem',
              '4xl': '2rem',
              '5xl': '3.5rem',
            },
            boxShadow: {
              'premium': '0 40px 100px -20px rgba(0, 0, 0, 0.7)',
              'gold-glow': '0 0 40px -10px rgba(212, 175, 55, 0.2)',
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-main: #0f172a;
            --border-gpt: #e2e8f0;
            --brand-primary: #0052FF;
            --brand-accent: #D4AF37;
            --bg-sidebar: #0D0D0D;
            --bg-deep: #050505;
            --border-soft: rgba(255, 255, 255, 0.05);
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        .dark:root {
            --bg-main: #050505;
            --text-main: #f1f5f9;
            --border-gpt: #1e293b;
        }

        body {
            font-family: 'Geist', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .hero-font { font-family: 'Bricolage Grotesque', sans-serif; }
        .mono-font { font-family: 'Geist Mono', monospace; }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.015;
            pointer-events: none;
            z-index: 9999;
        }

        .scrollbar-gpt::-webkit-scrollbar { width: 4px; }
        .scrollbar-gpt::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-gpt::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .scrollbar-gpt::-webkit-scrollbar-thumb:hover { background: rgba(0, 82, 255, 0.3); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05); }
        .dark .glass { background: rgba(13, 13, 13, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .gold-grid { background-image: radial-gradient(circle at 2px 2px, rgba(212, 175, 55, 0.03) 1px, transparent 0); background-size: 40px 40px; }
        .grid-bg { background-image: linear-gradient(to right, rgba(0,82,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,82,255,0.05) 1px, transparent 1px); background-size: 40px 40px; }
        .tech-grid { background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 24px 24px; }
        
        .brand-gradient-text {
          background: linear-gradient(135deg, #0052FF 0%, #D4AF37 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .noir-card {
          background: rgba(255, 255, 255, 0.01);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 2rem;
        }

        /* Futuristic scan animation */
        @keyframes scan {
          0% { transform: translateY(-100vh); }
          100% { transform: translateY(100vh); }
        }

        /* Modern Typography Tweak */
        h1, h2, h3, h4 {
            letter-spacing: -0.03em;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

}

</head>

    <div class="grain-overlay"></div>

</html>
